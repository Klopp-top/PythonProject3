<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Пиццерия 🍕</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    h1 {
      font-weight: 700;
      margin-bottom: 30px;
      color: #388e3c;
      text-align: center;
      font-size: 2rem;
    }
    .nav-tabs {
      border-bottom: 2px solid #388e3c;
      margin-bottom: 25px;
    }
    .nav-tabs .nav-link {
      color: #666;
      border: none;
      padding: 12px 20px;
      font-weight: 600;
    }
    .nav-tabs .nav-link.active {
      color: #388e3c;
      background: transparent;
      border-bottom: 3px solid #388e3c;
    }
    .btn-danger {
      background: #388e3c;
      border: none;
      padding: 12px;
      font-size: 1.1rem;
    }
    .btn-danger:hover {
      background: #2e7d32;
    }
    footer {
      margin-top: 40px;
      text-align: center;
      color: #999;
      font-size: 0.9rem;
    }
    .alert {
      margin-top: 20px;
    }
    .pizza-card {
      margin-bottom: 20px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .pizza-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }
    .pizza-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .pizza-body {
      padding: 15px;
    }
    .pizza-price {
      color: #388e3c;
      font-size: 1.3rem;
      font-weight: 700;
    }
    .nav-pills .nav-link {
      color: #666;
      border: 2px solid #e0e0e0;
      margin-right: 8px;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 0.9rem;
    }
    .nav-pills .nav-link.active {
      background: #388e3c;
      border-color: #388e3c;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container" id="authContainer">
    <h1>🍕 Пиццерия</h1>
    <img src="/img.png" class="img-fluid mb-3" />

    <ul class="nav nav-tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">
          Войти
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">
          Регистрация
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- Вход -->
      <div class="tab-pane fade show active" id="login" role="tabpanel">
        <form id="loginForm">
          <div class="mb-3">
            <label for="loginIdentifier" class="form-label">Логин или телефон</label>
            <input type="text" id="loginIdentifier" class="form-control" placeholder="Введите логин или номер" required />
          </div>
          <div class="mb-4">
            <label for="loginPassword" class="form-label">Пароль</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="Введите пароль" required />
          </div>
          <button type="submit" class="btn btn-danger w-100 fw-bold">Войти</button>
        </form>
        <div id="loginMessage"></div>
      </div>

      <!-- Регистрация -->
      <div class="tab-pane fade" id="register" role="tabpanel">
        <form id="registerForm">
          <div class="mb-3">
            <label for="regPhone" class="form-label">Номер телефона</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="+998 00 000 00 00"
                   pattern="^\+998\d{9}$" title="Введите номер в формате +998XXXXXXXXX (9 цифр после +998)" required />
            <div class="form-text">Формат: +998 и 9 цифр (например: +998901234567)</div>
          </div>
          <div class="mb-3">
            <label for="regLogin" class="form-label">Логин</label>
            <input type="text" id="regLogin" class="form-control" placeholder="Придумайте логин" minlength="3" maxlength="20" required />
          </div>
          <div class="mb-3">
            <label for="regPassword" class="form-label">Пароль</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Придумайте пароль" minlength="6" required />
          </div>
          <div class="mb-4">
            <label for="regPasswordConfirm" class="form-label">Подтвердите пароль</label>
            <input type="password" id="regPasswordConfirm" class="form-control" placeholder="Повторите пароль" minlength="6" required />
          </div>
          <button type="submit" class="btn btn-danger w-100 fw-bold" id="regBtn">Зарегистрироваться</button>
        </form>

        <!-- Форма подтверждения кода -->
        <form id="verifyForm" style="display: none;" class="mt-4">
          <div class="mb-3">
            <label for="verifyCode" class="form-label">Код из Telegram</label>
            <input type="text" id="verifyCode" class="form-control" placeholder="Введите 6-значный код" pattern="\d{6}" maxlength="6" required />
            <div class="form-text">Проверьте сообщения в Telegram</div>
          </div>
          <button type="submit" class="btn btn-danger w-100 fw-bold">Подтвердить код</button>
        </form>

        <div id="registerMessage"></div>
      </div>
    </div>
  </div>

  <footer>© 2025 Моя Пиццерия</footer>

  <!-- Меню с пиццами (скрыто по умолчанию) -->
  <div class="container" id="menuContainer" style="display: none;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>🍕 Меню</h1>
      <button class="btn btn-sm btn-outline-danger" id="logoutBtn">Выход</button>
    </div>
    <p class="text-center mb-4">Добро пожаловать, <strong id="userName"></strong>!</p>

    <!-- Категории меню -->
    <ul class="nav nav-pills mb-4 flex-nowrap overflow-auto" role="tablist" style="white-space: nowrap;">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" data-category="pizza" onclick="showCategory('pizza')">🍕 Пицца</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-category="burger" onclick="showCategory('burger')">🍔 Бургер</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-category="hotdog" onclick="showCategory('hotdog')">🌭 Хот-Дог</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-category="lavash" onclick="showCategory('lavash')">🌯 Лаваш</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-category="doner" onclick="showCategory('doner')">🥙 Донер</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-category="sides" onclick="showCategory('sides')">🍟 Гарниры</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-category="snacks" onclick="showCategory('snacks')">🍿 Снеки</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-category="salads" onclick="showCategory('salads')">🥗 Салаты</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-category="drinks" onclick="showCategory('drinks')">🥤 Напитки</button>
      </li>
    </ul>

    <div class="row" id="pizzaList">
      <!-- Товары будут добавлены через JS -->
    </div>

    <div class="mt-4">
      <button class="btn btn-danger w-100 fw-bold" id="cartBtn">
        🛒 Корзина (<span id="cartCount">0</span>)
      </button>
    </div>
  </div>

        { id: 44, name: "Острый донер", description: "Курица, острый соус, перец", price: 32000, image: "https://images.unsplash.com/photo-1639024471283-03518883512d?w=400" }
      ],
      sides: [
        { id: 51, name: "Картофель фри", description: "Хрустящий картофель с солью", price: 12000, image: "https://images.unsplash.com/photo-1576107232684-1279f390859f?w=400" },

        { id: 65, name: "Чесночные гренки", description: "С чесночным маслом", price: 10000, image: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400" }
      ],
      salads: [
        { id: 71, name: "Цезарь", description: "Салат, курица, пармезан, соус", price: 28000, image: "https://images.unsplash.com/photo-1546793665-c74683f339c1?w=400" },
        { id: 72, name: "Греческий салат", description: "Овощи, фета, оливки", price: 25000, image: "https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?w=400" },
        { id: 73, name: "Овощной микс", description: "Свежие сезонные овощи", price: 20000, image: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=400" },
        { id: 74, name: "Салат с тунцом", description: "Тунец, салат, помидоры, яйцо", price: 32000, image: "https://images.unsplash.com/photo-1505253716362-afaea1d3d1af?w=400" },
        { id: 75, name: "Капрезе", description: "Моцарелла, томаты, базилик", price: 26000, image: "https://images.unsplash.com/photo-1592417817098-8fd3d9eb14a5?w=400" }
      ],
      drinks: [
        { id: 81, name: "Coca-Cola", description: "0.5л", price: 8000, image: "https://images.unsplash.com/photo-1554866585-cd94860890b7?w=400" },

        { id: 85, name: "Сок яблочный", description: "0.5л", price: 10000, image: "https://images.unsplash.com/photo-1568702846914-96b305d2aaeb?w=400" },
        { id: 86, name: "Вода минеральная", description: "0.5л", price: 5000, image: "https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=400" },
        { id: 87, name: "Чай холодный", description: "0.5л", price: 9000, image: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=400" }
      ]
    };

    // Добавление в корзину (глобальная функция)
    window.addToCart = function(itemId) {
      // Ищем товар во всех категориях
      let item = null;
      for (let category in menuItems) {
        item = menuItems[category].find(p => p.id === itemId);
        if (item) break;
      }

      if (!item) return;

      const existingItem = cart.find(i => i.id === itemId);

      if (existingItem) {
        existingItem.quantity++;
      } else {
        cart.push({ ...item, quantity: 1 });
      }

      updateCartCount();
      showNotification(`${item.name} добавлен в корзину!`);
    }

    // Показать категорию (глобальная функция)
    window.showCategory = function(category) {
      currentCategory = category;

      // Обновляем активную кнопку
      document.querySelectorAll('.nav-pills .nav-link').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`[data-category="${category}"]`).classList.add('active');

      // Отображаем товары категории
      const items = menuItems[category] || [];
      const pizzaList = document.getElementById('pizzaList');

      pizzaList.innerHTML = items.map(item => `
        <div class="col-md-6">
          <div class="pizza-card">
            <img src="${item.image}" class="pizza-img" alt="${item.name}">
            <div class="pizza-body">
              <h5>${item.name}</h5>
              <p class="text-muted small">${item.description}</p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="pizza-price">${item.price.toLocaleString()} сум</span>
                <button class="btn btn-sm btn-danger" onclick="addToCart(${item.id})">
                  В корзину
                </button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Отображение меню
    function showMenu(user) {
      currentUser = user;
      document.getElementById('authContainer').style.display = 'none';
      document.getElementById('menuContainer').style.display = 'block';
      document.getElementById('userName').textContent = user.username;

      // Показываем пиццы по умолчанию
      showCategory('pizza');
    }

    // Обновление счетчика корзины
    function updateCartCount() {
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cartCount').textContent = totalItems;
    }

    // Уведомление
    function showNotification(message) {
      tg.showAlert(message);
    }

    // Выход
    document.getElementById('logoutBtn').addEventListener('click', () => {
      currentUser = null;
      cart = [];
      document.getElementById('authContainer').style.display = 'block';
      document.getElementById('menuContainer').style.display = 'none';
      updateCartCount();
    });

    // Корзина
    document.getElementById('cartBtn').addEventListener('click', () => {
      if (cart.length === 0) {
        showNotification('Корзина пустая!');
        return;
      }

      const cartText = cart.map(item =>
        `${item.name} x${item.quantity} - ${(item.price * item.quantity).toLocaleString()} сум`
      ).join('\n');

      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      showNotification(`Ваш заказ:\n\n${cartText}\n\nИтого: ${total.toLocaleString()} сум`);
    });

    // Вход
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const identifier = document.getElementById('loginIdentifier').value.trim().replace(/\s/g, '');
      const password = document.getElementById('loginPassword').value.trim();

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });

        const data = await response.json();
        const msgDiv = document.getElementById('loginMessage');

        if (data.status === 'ok') {
          msgDiv.innerHTML = `<div class="alert alert-success">${data.message}<br>Добро пожаловать, ${data.user.username}!</div>`;
          setTimeout(() => showMenu(data.user), 1000);
        } else {
          msgDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        }
      } catch (err) {
        document.getElementById('loginMessage').innerHTML = '<div class="alert alert-danger">Ошибка подключения к серверу</div>';
      }
    });

    // Регистрация
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const phone = document.getElementById('regPhone').value.trim().replace(/\s/g, '');
      const username = document.getElementById('regLogin').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const passwordConfirm = document.getElementById('regPasswordConfirm').value.trim();

      const msgDiv = document.getElementById('registerMessage');

      // Проверка формата номера
      const phoneRegex = /^\+998\d{9}$/;
      if (!phoneRegex.test(phone)) {
        msgDiv.innerHTML = '<div class="alert alert-danger">Неверный формат номера! Нужно: +998 и 9 цифр</div>';
        return;
      }

      // Проверка совпадения паролей
      if (password !== passwordConfirm) {
        msgDiv.innerHTML = '<div class="alert alert-danger">Пароли не совпадают!</div>';
        return;
      }

      try {
        const response = await fetch(`${API_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            telegram_id: telegramId,
            phone,
            username,
            password
          })
        });

        const data = await response.json();

        if (data.status === 'ok') {
          msgDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
          // Показываем форму ввода кода
          document.getElementById('registerForm').style.display = 'none';
          document.getElementById('verifyForm').style.display = 'block';
        } else {
          msgDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        }
      } catch (err) {
        msgDiv.innerHTML = '<div class="alert alert-danger">Ошибка подключения к серверу</div>';
      }
    });

    // Подтверждение кода
    document.getElementById('verifyForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const code = document.getElementById('verifyCode').value.trim();
      const msgDiv = document.getElementById('registerMessage');

      try {
        const response = await fetch(`${API_URL}/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            telegram_id: telegramId,
            code
          })
        });

        const data = await response.json();

        if (data.status === 'ok') {
          msgDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
          document.getElementById('verifyForm').reset();
          setTimeout(() => {
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('verifyForm').style.display = 'none';
            document.getElementById('registerForm').reset();
            document.getElementById('login-tab').click();
          }, 2000);
        } else {
          msgDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        }
      } catch (err) {
        msgDiv.innerHTML = '<div class="alert alert-danger">Ошибка подключения к серверу</div>';
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
