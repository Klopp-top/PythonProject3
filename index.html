<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Пиццерия 🍕</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    h1 {
      font-weight: 700;
      margin-bottom: 30px;
      color: #388e3c; /* Зеленый цвет */
      text-align: center;
      font-size: 2rem;
    }
    .nav-tabs {
      border-bottom: 2px solid #388e3c;
      margin-bottom: 25px;
    }
    .nav-tabs .nav-link {
      color: #666;
      border: none;
      padding: 12px 20px;
      font-weight: 600;
    }
    .nav-tabs .nav-link.active {
      color: #388e3c;
      background: transparent;
      border-bottom: 3px solid #388e3c;
    }
    .btn-danger {
      background: #388e3c; /* Зеленая кнопка */
      border: none;
      padding: 12px;
      font-size: 1.1rem;
    }
    .btn-danger:hover {
      background: #2e7d32; /* Темно-зеленая кнопка при наведении */
    }
    footer {
      margin-top: 40px;
      text-align: center;
      color: #999;
      font-size: 0.9rem;
    }
    .alert {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🍕 Пиццерия</h1>
    <img src="/img.png" class="img-fluid mb-3" />
    <ul class="nav nav-tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">
          Войти
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">
          Регистрация
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- Вход -->
      <div class="tab-pane fade show active" id="login" role="tabpanel">
        <form id="loginForm">
          <div class="mb-3">
            <label for="loginPhone" class="form-label">Номер телефона</label>
            <input type="tel" id="loginPhone" class="form-control" placeholder="+998 00 000 00 00" required />
          </div>
          <div class="mb-4">
            <label for="loginPassword" class="form-label">Пароль</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="Введите пароль" required />
          </div>
          <button type="submit" class="btn btn-danger w-100 fw-bold">Войти</button>
        </form>
        <div id="loginMessage"></div>
      </div>

      <!-- Регистрация -->
      <div class="tab-pane fade" id="register" role="tabpanel">
        <form id="registerForm">
          <div class="mb-3">
            <label for="regPhone" class="form-label">Номер телефона</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="+998 00 000 00 00" required />
            <div class="form-text">Формат: +998 00 000 00 00</div>
          </div>
          <div class="mb-3">
            <label for="regLogin" class="form-label">Логин</label>
            <input type="text" id="regLogin" class="form-control" placeholder="Придумайте логин" minlength="3" maxlength="20" required />
          </div>
          <div class="mb-4">
            <label for="regPassword" class="form-label">Пароль</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Придумайте пароль" minlength="6" required />
          </div>
          <button type="submit" class="btn btn-danger w-100 fw-bold">Зарегистрироваться</button>
        </form>
        <div id="registerMessage"></div>
      </div>
    </div>
  </div>

  <footer>© 2025 Моя Пиццерия</footer>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const API_URL = 'http://localhost:8000';
    const telegramId = tg.initDataUnsafe?.user?.id || 123456789;

    // Вход
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const phone = document.getElementById('loginPhone').value.trim().replace(/\s/g, '');
      const password = document.getElementById('loginPassword').value.trim();

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });

        const data = await response.json();
        const msgDiv = document.getElementById('loginMessage');

        if (data.status === 'ok') {
          msgDiv.innerHTML = `<div class="alert alert-success">${data.message}<br>Добро пожаловать, ${data.user.username}!</div>`;
          setTimeout(() => tg.close(), 2000);
        } else {
          msgDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        }
      } catch (err) {
        document.getElementById('loginMessage').innerHTML = '<div class="alert alert-danger">Ошибка подключения к серверу</div>';
      }
    });

    // Регистрация
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const phone = document.getElementById('regPhone').value.trim().replace(/\s/g, '');
      const username = document.getElementById('regLogin').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      try {
        const response = await fetch(`${API_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            telegram_id: telegramId,
            phone,
            username,
            password
          })
        });

        const data = await response.json();
        const msgDiv = document.getElementById('registerMessage');

        if (data.status === 'ok') {
          msgDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
          document.getElementById('registerForm').reset();
          setTimeout(() => {
            document.getElementById('login-tab').click();
          }, 1500);
        } else {
          msgDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        }
      } catch (err) {
        document.getElementById('registerMessage').innerHTML = '<div class="alert alert-danger">Ошибка подключения к серверу</div>';
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
