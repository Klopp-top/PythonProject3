<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мини-приложение Пиццерия</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background: #fff8e1; /* мягкий светло-жёлтый фон */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .container {
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }
    h1 {
      font-weight: 700;
      margin-bottom: 25px;
      color: #d84315; /* яркий оранжево-красный */
      text-align: center;
    }
    footer {
      margin-top: 40px;
      text-align: center;
      color: #999;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Регистрация 🍕</h1>

    <form id="registerForm" autocomplete="off">
      <div class="mb-3">
        <label for="phone" class="form-label">Номер телефона</label>
        <input
          type="tel"
          id="phone"
          class="form-control"
          placeholder="+7 999 999 99 99"
          pattern="^\+7\s?\d{3}\s?\d{3}\s?\d{2}\s?\d{2}$"
          required
        />
        <div class="form-text">Введите номер в формате +7 999 999 99 99</div>
      </div>

      <div class="mb-3">
        <label for="login" class="form-label">Логин</label>
        <input
          type="text"
          id="login"
          class="form-control"
          placeholder="Придумайте логин"
          minlength="3"
          maxlength="20"
          required
        />
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Пароль</label>
        <input
          type="password"
          id="password"
          class="form-control"
          placeholder="Придумайте пароль"
          minlength="6"
          required
        />
      </div>

      <button type="submit" class="btn btn-danger w-100 fw-bold">
        Зарегистрироваться
      </button>
    </form>
  </div>

  <footer>
    © 2025 Моя Пиццерия
  </footer>

  <script>
    const tg = window.Telegram.WebApp;

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const phone = document.getElementById('phone').value.trim();
      const login = document.getElementById('login').value.trim();
      const password = document.getElementById('password').value.trim();

      // Простая валидация
      if (!phone || !login || !password) {
        alert('Пожалуйста, заполните все поля.');
        return;
      }

      // Тут можно отправить данные на backend (например, через fetch)
      // Сейчас просто покажем alert для примера

      alert(`Спасибо за регистрацию, ${login}!`);

      // Если нужно — можно закрыть WebApp:
      // tg.close();
    });
  </script>

  <!-- Telegram WebApp JS SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Bootstrap JS (для интерактивных компонентов, необязательно) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
